pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Kikugie'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 多版本：Stonecutter 负责"一份源码 + 每个版本一个节点"
// 用法：.\gradlew.bat :26.1.2:build / :26.1.2:runClient；不带前缀时走 vcsVersion
plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	shared {
		// 加新版本就在这里加一行，例如：versions '26.1.2', '1.21.1', '1.20.1'
		// 26.x 那一代：默认脚本（build.gradle = 官方映射 + 新插件 id + 新版 Loom）
		vers '26.1.2'
		// Yarn 那一代：换用 build-legacy.gradle（旧插件 id fabric-loom + 当年的 Loom + yarn_mappings）
		//
		// 注意：启用 1.21.1 之前，版本层（8 个类 + 11 个 mixin）必须先用 Yarn 的名字改写完，
		// 否则它会编译不过，而**根 build 会聚合所有节点**，一挂上去 gradlew build 就红。
		// 所以移植期间先把这行注释掉，改完再放开：
		// vers('1.21.1').buildscript('build-legacy.gradle')
		vcsVersion = '26.1.2'
	}
	create(rootProject)
}

// 与 mod id 保持一致
rootProject.name = 'mchanhua-mod'
