pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Kikugie'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 多版本：Stonecutter 负责"一份源码 + 每个版本一个节点"
// 用法：.\gradlew.bat :26.1.2:build / :26.1.2:runClient；不带前缀时走 vcsVersion
plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	shared {
		versions '26.1.2'
		vcsVersion = '26.1.2'
	}
	create(rootProject)
}

// 与 mod id 保持一致
rootProject.name = 'mchanhua-mod'
