// 各条版本线共用的构建配置。
// 这里**不能**出现 plugins {} 块：Loom 的插件 id 与版本按线不同，放在各线自己的脚本里声明：
//   - 26.x（modern）        : net.fabricmc.fabric-loom（新 id，Loom 1.14+）
//   - 1.21.x/1.20.x（legacy）: fabric-loom（旧 id，Yarn 时代），并用 yarn_mappings 指定映射
// 每条线通过自己的 gradle.properties 提供 minecraft_version / loader_version /
// fabric_api_version / java_version（legacy 还要 loom_version 与 yarn_mappings）。

repositories {
	// Loom 会自动带上 Minecraft 与 Fabric 的仓库；这里只留给"以后要依赖别的 mod"用
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mchanhua" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// mappings 要写在 minecraft 前面，Loom 才认（只有 legacy 线有）
	if (project.hasProperty('yarn_mappings') && !project.yarn_mappings.toString().isBlank()) {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	}
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API：客户端 HUD / 按键注册要用到
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// 每条线的 Java 版本不同（26.x=25、1.21.x=21、1.20.1=17、1.16.5=8）
def targetJava = project.hasProperty('java_version') ? project.java_version.toString() : '25'

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJava as Integer
	// 源码里有中文注释/文案，明确按 UTF-8 读，免得跟着 Windows 默认编码跑
	it.options.encoding = 'UTF-8'
}

java {
	// 生成 sourcesJar（Loom 会接到 remapSourcesJar 与 build 任务上）
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(targetJava)
	targetCompatibility = JavaVersion.toVersion(targetJava)
}

// 多版本之后 jar 名字要能一眼看出是给哪个游戏版本的：
// mchanhua-26.1.2-0.1.0.jar / mchanhua-1.21.1-0.1.0.jar …
base {
	archivesName = "mchanhua-${project.minecraft_version}"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// 发布目标按需再加
	}
}

// 翻译链路自测：不进游戏，直接用桌面版的 API Key 打一次真实请求
// 用法：.\gradlew.bat selftest
tasks.register('selftest', JavaExec) {
	group = 'mchanhua'
	description = 'Translate a sample tooltip with the real API key (no game launch)'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.mchanhua.client.translate.TranslatorSelfTest'
}

// HUD 排版自测：断行 / 截断 / 面板宽度
tasks.register('hudtest', JavaExec) {
	group = 'mchanhua'
	description = 'Assert HUD text wrapping keeps long lines inside the panel (no game launch)'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.mchanhua.client.hud.HudLayoutSelfTest'
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

// 设置界面的配置逻辑自测：数字填错、地址留空、key 带空格这些"手滑"都要稳妥
tasks.register('configtest', JavaExec) {
	group = 'mchanhua'
	description = 'Assert the in-game settings draft falls back safely (no game launch)'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.mchanhua.client.config.ConfigDraftSelfTest'
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

// 翻译链路自测：回放防重入（曾经的 StackOverflow 崩溃）+ 逐行挑选（混排 tooltip 漏翻）
tasks.register('translatetest', JavaExec) {
	group = 'mchanhua'
	description = 'Assert replay guard and per-line selection (no game launch)'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.mchanhua.client.translate.TranslateLogicSelfTest'
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.named('check').configure {
	dependsOn 'hudtest'
	dependsOn 'configtest'
	dependsOn 'translatetest'
}
