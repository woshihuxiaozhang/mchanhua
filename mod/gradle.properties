# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 多版本要按目标游戏版本选择 JDK（26.x 要 25、1.21.x 要 21、1.20.1 要 17），
# 这里登记本机装好的 JDK，Gradle 的 toolchain 才找得到。（本机路径，换机器要改）
org.gradle.java.installations.paths=D:/Tools/jdk-25,D:/Tools/jdk-21

# Fabric Properties
# 版本对应关系查这里：https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
version=0.1.0
group=com.mchanhua

# Dependencies
fabric_api_version=0.155.3+26.1.2
