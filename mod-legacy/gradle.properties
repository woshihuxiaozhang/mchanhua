# 这是"老版本专用"的独立 mod 工程（Yarn 那一代），跟 26.x 的 mod/ 互不影响。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 本机 JDK 登记（26.x 用 25；这条线要 21）
org.gradle.java.installations.paths=D:/Tools/jdk-25,D:/Tools/jdk-21

# Fabric Properties —— 老版本用的是"旧插件 id + 当年的 Loom + Yarn 映射"
# 实测：Loom 1.13.6 能在 Gradle 9.7.1 上正常处理 1.21.x 的 intermediary access widener；
#       Loom 1.14+ 会报 Expected official namespace。
minecraft_version=1.21.1
loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1
yarn_mappings=1.21.1+build.3
loom_version=1.13.6
java_version=21

# Mod Properties
version=0.1.0
group=com.mchanhua
