// 老版本线（1.21.x / 1.20.x / …）：Yarn 映射那一代。
//
// 关键点（都实测过）：
// - 插件 id 必须用旧的 fabric-loom：新 id net.fabricmc.fabric-loom 只覆盖 Loom 1.14+；
// - Loom 1.14+ 处理不了老 Fabric API 的 intermediary access widener（Expected official namespace）；
// - 代码用 Yarn 名字（MinecraftClient / DrawContext / ChatHud / InGameHud / ButtonWidget …）。
plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	// 这一代 Loom 已默认关掉 Mixin 注解处理器（日志里会提示 remove any loom.mixin configuration），
	// 所以注解 API 自己加：只 compileOnly，重映射交给 Loom 在 remapJar 时做。

	mods {
		"mchanhua" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// 必须用 modImplementation：老版 Fabric API 发的是 intermediary 版本的 jar，
	// Loom 要把它重映射到 Yarn 才能编译（26.x 那条线 Fabric 已按官方映射发布，所以 implementation 也行）。
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
	// dev 启动时 Fabric Loader 自己要找 ASM（26.x 那代的 loader 自带，这一代没有），显式补上。
	// 只影响开发环境，打出来的 jar 里不含这些。
	runtimeOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
	// 1.20.1 用的是当年的 loader（0.14.25），它在开发环境还额外需要这两个库：
	// net.fabricmc.mapping.tree.TinyMappingFactory（mapping-io）与 net.fabricmc.accesswidener.*
	// TinyMappingFactory 在 tiny-mappings-parser 里（不是 mapping-io，别搞混）
	runtimeOnly 'net.fabricmc:tiny-mappings-parser:0.3.0+build.17'
	runtimeOnly 'net.fabricmc:tiny-remapper:0.14.1'
	runtimeOnly 'net.fabricmc:access-widener:2.1.0'
	runtimeOnly 'org.ow2.asm:asm:9.7.1'
	runtimeOnly 'org.ow2.asm:asm-tree:9.7.1'
	runtimeOnly 'org.ow2.asm:asm-analysis:9.7.1'
	runtimeOnly 'org.ow2.asm:asm-commons:9.7.1'
	runtimeOnly 'org.ow2.asm:asm-util:9.7.1'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as Integer
	// 源码里有中文注释与文案，明确按 UTF-8 读
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

base {
	archivesName = "mchanhua-legacy-${project.minecraft_version}"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// 与 26.x 那版同样的自测：纯逻辑，不进游戏、不联网
tasks.register('hudtest', JavaExec) {
	group = 'mchanhua'
	description = 'Assert HUD text wrapping keeps long lines inside the panel (no game launch)'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.mchanhua.client.hud.HudLayoutSelfTest'
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.register('configtest', JavaExec) {
	group = 'mchanhua'
	description = 'Assert the in-game settings draft falls back safely (no game launch)'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.mchanhua.client.config.ConfigDraftSelfTest'
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.register('translatetest', JavaExec) {
	group = 'mchanhua'
	description = 'Assert replay guard and per-line selection (no game launch)'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.mchanhua.client.translate.TranslateLogicSelfTest'
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.named('check').configure {
	dependsOn 'hudtest'
	dependsOn 'configtest'
	dependsOn 'translatetest'
}
