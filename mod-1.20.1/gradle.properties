# 1.20.1 专用工程（Yarn 那一代；1.20.1 跑在 Java 17 上）
#
# 和 mod-legacy（1.21.1）是同一套代码的两份拷贝：
# 老版本之间 API 签名有差别（tooltip 的参数、书屏的 Contents 结构等），
# 分开建工程的好处是各自独立可测；坏处是改动要手动同步——核心逻辑很少改，暂时这么办。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 本机 JDK 登记：26.x用25、1.21.x用21、1.20.1用17
org.gradle.java.installations.paths=D:/Tools/jdk-25,D:/Tools/jdk-21,D:/Tools/jdk-17

# Fabric Properties —— 老版本用"旧插件 id + 当年的 Loom + Yarn 映射"
minecraft_version=1.20.1
# loader 要同时满足两头：Fabric API 0.92.12 要求 >=0.16.10；
# 0.19.5（26.x 时代）会让 Loom 1.13.6 的重映射器解析不到 EnvType，所以取中间值
loader_version=0.16.14
fabric_api_version=0.92.12+1.20.1
yarn_mappings=1.20.1+build.10
loom_version=1.13.6
java_version=17

# Mod Properties
version=0.1.0
group=com.mchanhua
