[project]
name = "mchanhua"
version = "4.0.0"
description = "Minecraft 屏幕取词汉化小工具：热键截取游戏画面区域，OCR 后交给 DeepSeek 翻译，在小窗口里显示译文"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["minecraft", "ocr", "translation", "screen-translation", "deepseek", "游戏翻译"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/<your-name>/mchanhua"
Issues = "https://github.com/<your-name>/mchanhua/issues"

[project.scripts]
mchanhua = "mchanhua.cli:main"
dependencies = [
    "pillow>=10",
    "mss>=9",
    "httpx>=0.27",
    "keyboard>=0.13",
    "winrt-runtime>=3.2.1",
    "winrt-Windows.Foundation>=3.2.1",
    "winrt-Windows.Foundation.Collections>=3.2.1",
    "winrt-Windows.Globalization>=3.2.1",
    "winrt-Windows.Graphics.Imaging>=3.2.1",
    "winrt-Windows.Media.Ocr>=3.2.1",
    "winrt-Windows.Storage.Streams>=3.2.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
