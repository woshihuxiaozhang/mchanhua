# 1.21.8 专用工程（Yarn 那一代的后段；1.21.x 都是 Java 21）
#
# 说明：1.21.1 的 jar 装到 1.21.8 上会“注入失败”——mixin 是按精确签名写的，
# 1.21.x 中间的补丁版改过渲染/界面签名。所以这条线单独建工程、单独验证。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 本机 JDK 登记：26.x用25、1.21.x用21、1.20.1用17
org.gradle.java.installations.paths=D:/Tools/jdk-25,D:/Tools/jdk-21,D:/Tools/jdk-17

# Fabric Properties
minecraft_version=1.21.8
loader_version=0.19.5
fabric_api_version=0.136.1+1.21.8
yarn_mappings=1.21.8+build.1
loom_version=1.13.6
java_version=21

# Mod Properties
version=0.1.0
group=com.mchanhua
